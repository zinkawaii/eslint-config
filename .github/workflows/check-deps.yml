name: check-deps

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *

jobs:
  check-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2

      - name: Install Dependencies
        run: pnpm install

      - name: Update Vendor
        run: pnpm i @antfu/eslint-config@latest

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Check Dependencies
        run: pnpm vitest -r packages/zinkawaii deps.test.ts
