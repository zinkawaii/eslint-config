name: check-props

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *

jobs:
  check-props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2

      - name: Install Dependencies
        run: pnpm install

      - name: Update Data
        run: pnpm i known-css-properties@latest

      - name: Prepare
        run: pnpm run dev:prepare

      - name: Check Props
        run: pnpm vitest -r packages/css props.test.ts
